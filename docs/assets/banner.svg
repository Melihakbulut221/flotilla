<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">flotilla</title>
  <desc id="d">Self-hosted sandbox swarms and RL environments for LLM training</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172a"/>
      <stop offset="1" stop-color="#0d2c45"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hullA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>

  <!-- the fleet: sandboxes sailing in formation -->
  <g transform="translate(118 74)">
    <g fill="#1e4a6b" stroke="#2f6b92" stroke-width="1.5">
      <rect x="0"   y="96"  width="46" height="30" rx="7"/>
      <rect x="56"  y="64"  width="46" height="30" rx="7"/>
      <rect x="56"  y="128" width="46" height="30" rx="7"/>
      <rect x="112" y="32"  width="46" height="30" rx="7"/>
      <rect x="112" y="96"  width="46" height="30" rx="7"/>
      <rect x="112" y="160" width="46" height="30" rx="7"/>
      <rect x="168" y="64"  width="46" height="30" rx="7"/>
      <rect x="168" y="128" width="46" height="30" rx="7"/>
    </g>
    <rect x="224" y="96" width="46" height="30" rx="7" fill="url(#hullA)"/>
    <!-- status lights -->
    <g>
      <circle cx="12"  cy="111" r="4" fill="#4ade80"/>
      <circle cx="68"  cy="79"  r="4" fill="#4ade80"/>
      <circle cx="68"  cy="143" r="4" fill="#4ade80"/>
      <circle cx="124" cy="47"  r="4" fill="#4ade80"/>
      <circle cx="124" cy="111" r="4" fill="#facc15"/>
      <circle cx="124" cy="175" r="4" fill="#4ade80"/>
      <circle cx="180" cy="79"  r="4" fill="#4ade80"/>
      <circle cx="180" cy="143" r="4" fill="#f87171"/>
      <circle cx="236" cy="111" r="4" fill="#07172a"/>
    </g>
    <g stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
      <path d="M-30 111h18"/><path d="M26 79h18"/><path d="M26 143h18"/>
      <path d="M82 47h18"/><path d="M138 79h18"/><path d="M138 143h18"/>
    </g>
  </g>

  <rect x="80" y="330" width="1120" height="2" fill="url(#wave)"/>

  <!-- wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Ubuntu Sans', Helvetica, Arial, sans-serif">
    <text x="470" y="166" font-size="96" font-weight="700" fill="#f1f5f9" letter-spacing="-2">flotilla</text>
    <text x="474" y="214" font-size="25" fill="#9fb6cc">Self-hosted sandbox swarms and RL environments</text>
    <text x="474" y="246" font-size="25" fill="#9fb6cc">for LLM training.</text>
  </g>

  <!-- chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#5eead4">
    <rect x="474" y="268" width="184" height="32" rx="16" fill="#0f3b4f" stroke="#1f6f79"/>
    <text x="566" y="289" text-anchor="middle">zero dependencies</text>
    <rect x="670" y="268" width="192" height="32" rx="16" fill="#0f3b4f" stroke="#1f6f79"/>
    <text x="766" y="289" text-anchor="middle">rootless isolation</text>
    <rect x="874" y="268" width="230" height="32" rx="16" fill="#0f3b4f" stroke="#1f6f79"/>
    <text x="989" y="289" text-anchor="middle">hack-resistant rewards</text>
  </g>
</svg>
